name: Build Love8 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🎨 Compilation locale de Tailwind CSS & Préparation Capacitor 6
        run: |
          rm -rf android www package.json package-lock.json capacitor.config.json
          mkdir -p www
          cp index.html www/index.html
          if [ -f "Snapchat-1098749864.jpg" ]; then cp Snapchat-1098749864.jpg www/; fi
          if [ -f "icone.png" ]; then cp icone.png www/; fi

          sed -i "s|const API_ENDPOINT = '/state';|const API_ENDPOINT = 'https://love8-apps.pages.dev/state';|g" www/index.html

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 tailwindcss@3

          cat << 'EOF' > tailwind.config.js
          module.exports = {
            content: ["./www/index.html"],
            theme: { extend: {} },
            plugins: []
          }
          EOF

          echo "@tailwind base; @tailwind components; @tailwind utilities;" > input.css
          npx tailwindcss -i input.css -o www/tw.css --minify
          sed -i 's|<script src="https://cdn.tailwindcss.com"></script>|<link rel="stylesheet" href="tw.css" />|g' www/index.html

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.love8.app",
            "appName": "Love8",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          else
            echo "⚠️ Attention : google-services.json introuvable à la racine du dépôt !"
          fi

          if [ -f "icone.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              cp icone.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp icone.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp icone.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            done
          fi

      - name: 🔑 Restauration ou Création de la clé de signature fixe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.android
          gh release download latest -p "debug.keystore" -D ~/.android || true
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🔒 Configuration Gradle, Dépendance Firebase et Code Java FCM
        run: |
          echo "buildscript { dependencies { classpath 'com.google.gms:google-services:4.4.1' } }" >> android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.1.0')
              implementation 'com.google.firebase:firebase-messaging'
          }
          android {
              buildTypes {
                  debug {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

          cat << 'EOF' >> android/app/proguard-rules.pro
          -keep class com.love8.app.** { *; }
          -keep class com.getcapacitor.** { *; }
          -keep class com.google.firebase.messaging.** { *; }
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -dontwarn **
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".Love8FirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android/app/src/main/java/com/love8/app/Love8FirebaseMessagingService.java
          package com.love8.app;

          import android.app.KeyguardManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class Love8FirebaseMessagingService extends FirebaseMessagingService {
              @Override
              public void onNewToken(String token) {
                  super.onNewToken(token);
                  getSharedPreferences("love8_native", MODE_PRIVATE).edit().putString("fcm_token", token).apply();
              }

              @Override
              public void onMessageReceived(RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);
                  if (remoteMessage.getData().size() > 0) {
                      String title = remoteMessage.getData().get("title");
                      String body = remoteMessage.getData().get("body");
                      String sound = remoteMessage.getData().get("sound");
                      String emoji = remoteMessage.getData().get("emoji");
                      String evType = remoteMessage.getData().get("evType");
                      if (evType == null) evType = remoteMessage.getData().get("type");

                      if (title == null) title = "Love8 ❤️";
                      if (body == null) body = "Nouvelle vibration !";
                      if (emoji == null) emoji = "❤️";
                      if (evType == null) evType = "vibration";
                      if (sound == null) sound = "love";

                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                      boolean isInteractive = pm != null && pm.isInteractive();
                      boolean isLocked = km != null && km.isKeyguardLocked();
                      boolean wasSleeping = (!isInteractive || isLocked);

                      // Si le téléphone est déverrouillé ET que l'application est déjà ouverte au premier plan,
                      // on laisse le polling Web gérer l'animation sans relancer l'Activity ni fermer l'application !
                      if (!wasSleeping && MainActivity.isAppInForeground) {
                          return;
                      }

                      if (pm != null && wasSleeping) {
                          PowerManager.WakeLock screenLock = pm.newWakeLock(
                              PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP,
                              "love8:fcmWake"
                          );
                          screenLock.acquire(5000);
                      }

                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createWaveform(new long[]{0, 300, 100, 450}, -1));
                          } else {
                              v.vibrate(600);
                          }
                      }

                      Intent intent = new Intent(this, MainActivity.class);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                      intent.putExtra("lock_alert", true);
                      intent.putExtra("was_sleeping", wasSleeping);
                      intent.putExtra("emoji", emoji);
                      intent.putExtra("title", title);
                      intent.putExtra("message", body);
                      intent.putExtra("evType", evType);
                      intent.putExtra("sound", sound);

                      PendingIntent pendingIntent = PendingIntent.getActivity(
                          this, (int) System.currentTimeMillis(), intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel("love8_fcm_channel", "FCM Alerts", NotificationManager.IMPORTANCE_HIGH);
                          nm.createNotificationChannel(channel);
                      }

                      Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, "love8_fcm_channel")
                          : new Notification.Builder(this);

                      nb.setSmallIcon(android.R.drawable.ic_dialog_email)
                        .setContentTitle(title)
                        .setContentText(body)
                        .setAutoCancel(true)
                        .setContentIntent(pendingIntent)
                        .setFullScreenIntent(pendingIntent, true);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          nb.setVisibility(Notification.VISIBILITY_PUBLIC)
                            .setCategory(Notification.CATEGORY_ALARM);
                      }

                      nm.notify(999, nb.build());
                      startActivity(intent);
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/love8/app/MainActivity.java
          package com.love8.app;

          import android.Manifest;
          import android.app.DownloadManager;
          import android.app.KeyguardManager;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.Settings;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends BridgeActivity {
              public static boolean isAppInForeground = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }
                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                      WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                  );
                  getWindow().getDecorView().setBackgroundColor(Color.BLACK);

                  requestEssentialPermissions();
                  registerFcmToken();

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setBackgroundColor(Color.BLACK);
                      this.bridge.getWebView().addJavascriptInterface(new WebAppBridge(this), "AndroidNative");
                  }
                  handleWakeIntent(getIntent());
              }

              @Override
              public void onResume() {
                  super.onResume();
                  isAppInForeground = true;
              }

              @Override
              public void onPause() {
                  super.onPause();
                  isAppInForeground = false;
              }

              private void registerFcmToken() {
                  FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                      if (task.isSuccessful() && task.getResult() != null) {
                          String token = task.getResult();
                          getSharedPreferences("love8_native", MODE_PRIVATE).edit().putString("fcm_token", token).apply();
                      }
                  });
              }

              private void requestEssentialPermissions() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  if (Build.VERSION.SDK_INT >= 23) {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          try {
                              Intent ig = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              ig.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(ig);
                          } catch (Exception ignored) {}
                      }

                      if (!Settings.canDrawOverlays(this)) {
                          try {
                              Intent ov = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                              startActivity(ov);
                          } catch (Exception ignored) {}
                      }

                      if (Build.VERSION.SDK_INT >= 34) {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && !nm.canUseFullScreenIntent()) {
                              try {
                                  Intent fsi = new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT);
                                  fsi.setData(Uri.parse("package:" + getPackageName()));
                                  startActivity(fsi);
                              } catch (Exception ignored) {}
                          }
                      }
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleWakeIntent(intent);
              }

              private void handleWakeIntent(Intent intent) {
                  if (intent != null && intent.getBooleanExtra("lock_alert", false)) {
                      intent.removeExtra("lock_alert");

                      WindowManager.LayoutParams params = getWindow().getAttributes();
                      params.screenBrightness = WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE;
                      getWindow().setAttributes(params);

                      getWindow().addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                          WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                      );
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                          setShowWhenLocked(true);
                          setTurnScreenOn(true);
                      }

                      boolean wasSleeping = intent.getBooleanExtra("was_sleeping", true);
                      String emoji = intent.getStringExtra("emoji");
                      String title = intent.getStringExtra("title");
                      String msg = intent.getStringExtra("message");
                      String evType = intent.getStringExtra("evType");
                      String sound = intent.getStringExtra("sound");
                      if (emoji == null) emoji = "❤️";
                      if (title == null) title = "Love8";
                      if (msg == null) msg = "Vibration reçue !";
                      if (evType == null) evType = "vibration";
                      if (sound == null) sound = "love";

                      final String safeEmoji = emoji.replace("'", "\\'");
                      final String safeTitle = title.replace("'", "\\'");
                      final String safeMsg = msg.replace("'", "\\'");
                      final String safeType = evType.replace("'", "\\'");
                      final String safeSound = sound.replace("'", "\\'");
                      final String sleepFlag = wasSleeping ? "true" : "false";

                      // Masque immédiatement le contenu Web en noir avant même que la frame ne s'affiche
                      final String jsCall = "document.documentElement.classList.add('wake-blackout');" +
                          "if(window.onNativeWakeAlert){window.onNativeWakeAlert('" + safeEmoji + "','" + safeTitle + "','" + safeMsg + "','" + safeType + "','" + safeSound + "'," + sleepFlag + ");}" +
                          "else{window.__pendingWakeAlert=['" + safeEmoji + "','" + safeTitle + "','" + safeMsg + "','" + safeType + "','" + safeSound + "'," + sleepFlag + "];}";

                      this.bridge.getWebView().post(new Runnable() {
                          @Override
                          public void run() {
                              MainActivity.this.bridge.getWebView().evaluateJavascript(jsCall, null);
                          }
                      });
                  }
              }

              public class WebAppBridge {
                  Context ctx;
                  WebAppBridge(Context c) { this.ctx = c; }

                  @JavascriptInterface
                  public void setUser(String user) {
                      SharedPreferences prefs = ctx.getSharedPreferences("love8_native", MODE_PRIVATE);
                      prefs.edit().putString("current_user", user).apply();
                  }

                  @JavascriptInterface
                  public String getFcmToken() {
                      SharedPreferences prefs = ctx.getSharedPreferences("love8_native", MODE_PRIVATE);
                      return prefs.getString("fcm_token", "");
                  }

                  @JavascriptInterface
                  public void turnOffScreenAndSleep() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  WindowManager.LayoutParams params = getWindow().getAttributes();
                                  params.screenBrightness = 0.01f;
                                  getWindow().setAttributes(params);

                                  getWindow().clearFlags(
                                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                                      WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |
                                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                                      WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD
                                  );
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                                      setTurnScreenOn(false);
                                      setShowWhenLocked(false);
                                  }
                                  moveTaskToBack(true);
                              } catch (Exception ignored) {}
                          }
                      });
                  }

                  @JavascriptInterface
                  public void downloadApkUpdate(String url) {
                      try {
                          DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                          req.setTitle("Mise à jour Love8.apk");
                          req.setDescription("Téléchargement de la nouvelle version...");
                          req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "Love8-update.apk");
                          req.setMimeType("application/vnd.android.package-archive");

                          DownloadManager dm = (DownloadManager) ctx.getSystemService(Context.DOWNLOAD_SERVICE);
                          if (dm != null) {
                              dm.enqueue(req);
                          }

                          Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(browserIntent);
                      } catch (Exception e) {
                          try {
                              Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              ctx.startActivity(browserIntent);
                          } catch (Exception ignored) {}
                      }
                  }

                  @JavascriptInterface
                  public void vibrateDevice(String csvPattern) {
                      try {
                          String[] parts = csvPattern.split(",");
                          long[] timings = new long[parts.length + 1];
                          timings[0] = 0;
                          for (int i = 0; i < parts.length; i++) {
                              timings[i + 1] = Long.parseLong(parts[i].trim());
                          }
                          Vibrator v = (Vibrator) ctx.getSystemService(Context.VIBRATOR_SERVICE);
                          if (v != null) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  v.vibrate(VibrationEffect.createWaveform(timings, -1));
                              } else {
                                  v.vibrate(350);
                              }
                          }
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public boolean isDeviceLocked() {
                      KeyguardManager km = (KeyguardManager) ctx.getSystemService(Context.KEYGUARD_SERVICE);
                      return km != null && km.isKeyguardLocked();
                  }
              }
          }
          EOF

      - name: 🔨 Compilation de l'APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Love8.apk

      - name: 📤 Publication de l'APK dans Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Love8-Jordan-Lydie-APK
          path: android/app/build/outputs/apk/debug/Love8.apk

      - name: 🚀 Publication sur GitHub Releases (APK + Clé de signature persistante)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest android/app/build/outputs/apk/debug/Love8.apk ~/.android/debug.keystore --title "Dernière version Love8 APK" --notes "APK FCM signé avec clé persistante" || gh release upload latest android/app/build/outputs/apk/debug/Love8.apk ~/.android/debug.keystore --clobber
