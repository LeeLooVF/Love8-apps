name: Build Love8 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🎨 Compilation locale de Tailwind CSS & Préparation Capacitor 6 (Mode Hors-Ligne Instantané)
        run: |
          rm -rf android www package.json package-lock.json capacitor.config.json
          mkdir -p www
          cp index.html www/index.html
          if [ -f "Snapchat-1098749864.jpg" ]; then cp Snapchat-1098749864.jpg www/; fi
          if [ -f "icone.png" ]; then cp icone.png www/; fi

          sed -i "s|const API_ENDPOINT = '/state';|const API_ENDPOINT = 'https://love8-apps.pages.dev/state';|g" www/index.html

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 tailwindcss@3

          cat << 'EOF' > tailwind.config.js
          module.exports = {
            content: ["./www/index.html"],
            theme: { extend: {} },
            plugins: []
          }
          EOF

          echo "@tailwind base; @tailwind components; @tailwind utilities;" > input.css
          npx tailwindcss -i input.css -o www/tw.css --minify
          sed -i 's|<script src="https://cdn.tailwindcss.com"></script>|<link rel="stylesheet" href="tw.css" />|g' www/index.html

          # Mode 100% local (sans server.url distant) pour un démarrage en 0.1s sans écran blanc
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.love8.app",
            "appName": "Love8",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

          if [ -f "icone.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              cp icone.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp icone.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp icone.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            done
          fi

      - name: 🔑 Restauration ou Création de la clé de signature fixe (Fin du conflit de package)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.android
          gh release download latest -p "debug.keystore" -D ~/.android || true
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🔒 Écriture du AndroidManifest.xml, des règles R8 et des classes Java optimisées Batterie
        run: |
          cat << 'EOF' >> android/app/proguard-rules.pro
          -keep class com.love8.app.** { *; }
          -keep class com.getcapacitor.** { *; }
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -dontwarn **
          EOF

          cat << 'EOF' >> android/app/build.gradle
          android {
              buildTypes {
                  debug {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".Love8Service"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android/app/src/main/java/com/love8/app/BootReceiver.java
          package com.love8.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      Intent svc = new Intent(context, Love8Service.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(svc);
                      } else {
                          context.startService(svc);
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/love8/app/Love8Service.java
          package com.love8.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class Love8Service extends Service {
              private static final String CHANNEL_BG = "love8_bg_service_v9";
              private static final String CHANNEL_ALERTS = "love8_alerts_v9";
              private Handler handler = new Handler(Looper.getMainLooper());
              private Runnable poller;
              private PowerManager.WakeLock cpuWakeLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannels();

                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      cpuWakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "love8:cpuKeepAlive");
                      cpuWakeLock.setReferenceCounted(false);
                      cpuWakeLock.acquire();
                  }

                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(this, CHANNEL_BG)
                      : new Notification.Builder(this);

                  Notification bgNotif = builder
                      .setContentTitle("Love8 Éco-Veille Actif ⚡")
                      .setContentText("Connecté en mode basse consommation")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setOngoing(true)
                      .build();

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1001, bgNotif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(1001, bgNotif);
                  }
                  startPolling();
              }

              private void createChannels() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      NotificationChannel bg = new NotificationChannel(CHANNEL_BG, "Veille Éco Love8", NotificationManager.IMPORTANCE_LOW);
                      nm.createNotificationChannel(bg);

                      Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      AudioAttributes attrs = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .build();

                      NotificationChannel alerts = new NotificationChannel(CHANNEL_ALERTS, "Urgent Lockscreen Love8", NotificationManager.IMPORTANCE_HIGH);
                      alerts.enableVibration(true);
                      alerts.setVibrationPattern(new long[]{0, 300, 100, 450});
                      alerts.setSound(soundUri, attrs);
                      alerts.setBypassDnd(true);
                      alerts.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(alerts);
                  }
              }

              public static void triggerSosFlashStrobe(final Context context, final int pulses) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              CameraManager camManager = (CameraManager) context.getSystemService(Context.CAMERA_SERVICE);
                              if (camManager == null) return;
                              String torchCamId = null;
                              for (String id : camManager.getCameraIdList()) {
                                  Boolean hasFlash = camManager.getCameraCharacteristics(id).get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                                  if (hasFlash != null && hasFlash) {
                                      torchCamId = id;
                                      break;
                                  }
                              }
                              if (torchCamId == null) return;
                              for (int i = 0; i < pulses; i++) {
                                  camManager.setTorchMode(torchCamId, true);
                                  Thread.sleep(120);
                                  camManager.setTorchMode(torchCamId, false);
                                  Thread.sleep(100);
                              }
                          } catch (Exception ignored) {}
                      }
                  }).start();
              }

              private void startPolling() {
                  poller = new Runnable() {
                      @Override
                      public void run() {
                          new Thread(new Runnable() {
                              @Override
                              public void run() {
                                  checkCloudPing();
                              }
                          }).start();

                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          boolean isScreenOn = pm != null && pm.isInteractive();
                          // Polling adaptatif : 2.5s écran allumé, 5s écran éteint
                          long delayMs = isScreenOn ? 2500L : 5000L;
                          handler.postDelayed(this, delayMs);
                      }
                  };
                  handler.post(poller);
              }

              private void checkCloudPing() {
                  HttpURLConnection conn = null;
                  try {
                      // Route ultra-légère ?action=ping (< 120 octets)
                      URL url = new URL("https://love8-apps.pages.dev/state?action=ping&t=" + System.currentTimeMillis());
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setUseCaches(false);
                      conn.setRequestProperty("Cache-Control", "no-cache");
                      conn.setRequestProperty("Connection", "keep-alive");
                      conn.setConnectTimeout(2500);
                      conn.setReadTimeout(2500);

                      BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = reader.readLine()) != null) sb.append(line);
                      reader.close();

                      JSONObject ev = new JSONObject(sb.toString());
                      long evId = ev.optLong("id", 0);
                      if (evId == 0) return;

                      String sender = ev.optString("s", "");
                      String evType = ev.optString("t", "vibration");
                      String title = ev.optString("ti", "Love8 ❤️");
                      String message = ev.optString("m", "Nouvelle vibration !");
                      String emoji = ev.optString("e", "❤️");
                      String sound = ev.optString("snd", "love");

                      SharedPreferences prefs = getSharedPreferences("love8_native", MODE_PRIVATE);
                      long lastSeen = prefs.getLong("last_event_id", 0);
                      String myUser = prefs.getString("current_user", "Jordan");

                      if (lastSeen == 0 && (System.currentTimeMillis() - evId > 20000)) {
                          prefs.edit().putLong("last_event_id", evId).apply();
                          return;
                      }

                      if (evId > lastSeen) {
                          prefs.edit().putLong("last_event_id", evId).apply();

                          if (evType.equalsIgnoreCase("cat") || title.toLowerCase().contains("douglasse")) {
                              return;
                          }

                          if (!sender.isEmpty() && !sender.equalsIgnoreCase(myUser)) {
                              sendAckToCloud(evId, myUser);
                              triggerWakeAndNotification(title, message, emoji, evType, sound);
                          }
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              private void sendAckToCloud(final long evId, final String myUser) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              URL url = new URL("https://love8-apps.pages.dev/state?action=ack");
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setRequestMethod("POST");
                              conn.setRequestProperty("Content-Type", "application/json");
                              conn.setDoOutput(true);
                              conn.setConnectTimeout(2500);
                              String timeStr = new SimpleDateFormat("HH:mm", Locale.FRANCE).format(new Date());
                              String payload = "{\"id\":" + evId + ",\"by\":\"" + myUser + "\",\"at\":\"" + timeStr + "\"}";
                              OutputStream os = conn.getOutputStream();
                              os.write(payload.getBytes("UTF-8"));
                              os.close();
                              conn.getResponseCode();
                              conn.disconnect();
                          } catch (Exception ignored) {}
                      }
                  }).start();
              }

              public void triggerWakeAndNotification(final String title, final String message, final String emoji, final String evType, final String sound) {
                  handler.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              long wakeDurationMs = "vibration".equalsIgnoreCase(evType) ? 3500 : 15000;

                              if ("siren".equalsIgnoreCase(sound) || title.contains("S.O.S")) {
                                  triggerSosFlashStrobe(Love8Service.this, 12);
                              }

                              PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                              if (pm != null) {
                                  PowerManager.WakeLock screenLock = pm.newWakeLock(
                                      PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP,
                                      "love8:screenWake"
                                  );
                                  screenLock.acquire(wakeDurationMs);
                              }

                              Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                              if (v != null) {
                                  long[] vibPattern = "siren".equalsIgnoreCase(sound)
                                      ? new long[]{0, 400, 100, 400, 100, 400, 100, 600}
                                      : new long[]{0, 300, 100, 450};
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      v.vibrate(VibrationEffect.createWaveform(vibPattern, -1));
                                  } else {
                                      v.vibrate(800);
                                  }
                              }

                              Intent fullIntent = new Intent(Love8Service.this, MainActivity.class);
                              fullIntent.addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK |
                                  Intent.FLAG_ACTIVITY_SINGLE_TOP |
                                  Intent.FLAG_ACTIVITY_CLEAR_TOP |
                                  Intent.FLAG_ACTIVITY_REORDER_TO_FRONT
                              );
                              fullIntent.putExtra("lock_alert", true);
                              fullIntent.putExtra("emoji", emoji);
                              fullIntent.putExtra("title", title);
                              fullIntent.putExtra("message", message);
                              fullIntent.putExtra("evType", evType);
                              fullIntent.putExtra("sound", sound);

                              PendingIntent fullPending = PendingIntent.getActivity(
                                  Love8Service.this, (int) System.currentTimeMillis(), fullIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );

                              Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                                  ? new Notification.Builder(Love8Service.this, CHANNEL_ALERTS)
                                  : new Notification.Builder(Love8Service.this);

                              nb.setSmallIcon(android.R.drawable.ic_dialog_email)
                                .setContentTitle(title)
                                .setContentText(message)
                                .setAutoCancel(true)
                                .setContentIntent(fullPending)
                                .setFullScreenIntent(fullPending, true);

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                                  nb.setVisibility(Notification.VISIBILITY_PUBLIC)
                                    .setCategory(Notification.CATEGORY_ALARM);
                              }

                              NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                              nm.notify((int) (System.currentTimeMillis() % 10000), nb.build());

                              startActivity(fullIntent);
                          } catch (Exception ignored) {}
                      }
                  });
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (cpuWakeLock != null && cpuWakeLock.isHeld()) cpuWakeLock.release();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/love8/app/MainActivity.java
          package com.love8.app;

          import android.Manifest;
          import android.app.DownloadManager;
          import android.app.KeyguardManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.Settings;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.List;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }
                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                      WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                  );

                  requestAllNeededPermissions();

                  Intent svc = new Intent(this, Love8Service.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(svc);
                  } else {
                      startService(svc);
                  }

                  this.bridge.getWebView().addJavascriptInterface(new WebAppBridge(this), "AndroidNative");
                  handleWakeIntent(getIntent());
              }

              private void requestAllNeededPermissions() {
                  if (Build.VERSION.SDK_INT >= 23) {
                      List<String> perms = new ArrayList<>();
                      perms.add(Manifest.permission.ACCESS_FINE_LOCATION);
                      perms.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                      perms.add(Manifest.permission.CAMERA);

                      if (Build.VERSION.SDK_INT >= 33) {
                          perms.add(Manifest.permission.POST_NOTIFICATIONS);
                      }

                      List<String> toRequest = new ArrayList<>();
                      for (String p : perms) {
                          if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) {
                              toRequest.add(p);
                          }
                      }
                      if (!toRequest.isEmpty()) {
                          requestPermissions(toRequest.toArray(new String[0]), 101);
                      }

                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          try {
                              Intent ig = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              ig.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(ig);
                          } catch (Exception ignored) {}
                      }

                      if (!Settings.canDrawOverlays(this)) {
                          try {
                              Intent ov = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                              startActivity(ov);
                          } catch (Exception ignored) {}
                      }

                      if (Build.VERSION.SDK_INT >= 34) {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && !nm.canUseFullScreenIntent()) {
                              try {
                                  Intent fsi = new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT);
                                  fsi.setData(Uri.parse("package:" + getPackageName()));
                                  startActivity(fsi);
                              } catch (Exception ignored) {}
                          }
                      }
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleWakeIntent(intent);
              }

              private void handleWakeIntent(Intent intent) {
                  if (intent != null && intent.getBooleanExtra("lock_alert", false)) {
                      WindowManager.LayoutParams params = getWindow().getAttributes();
                      params.screenBrightness = WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE;
                      getWindow().setAttributes(params);

                      getWindow().addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                          WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                      );
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                          setShowWhenLocked(true);
                          setTurnScreenOn(true);
                      }
                      String emoji = intent.getStringExtra("emoji");
                      String title = intent.getStringExtra("title");
                      String msg = intent.getStringExtra("message");
                      String evType = intent.getStringExtra("evType");
                      String sound = intent.getStringExtra("sound");
                      if (emoji == null) emoji = "❤️";
                      if (title == null) title = "Love8";
                      if (msg == null) msg = "Vibration reçue !";
                      if (evType == null) evType = "vibration";
                      if (sound == null) sound = "love";

                      final String safeEmoji = emoji.replace("'", "\\'");
                      final String safeTitle = title.replace("'", "\\'");
                      final String safeMsg = msg.replace("'", "\\'");
                      final String safeType = evType.replace("'", "\\'");
                      final String safeSound = sound.replace("'", "\\'");

                      this.bridge.getWebView().postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              MainActivity.this.bridge.getWebView().evaluateJavascript(
                                  "if(window.onNativeWakeAlert) window.onNativeWakeAlert('" + safeEmoji + "','" + safeTitle + "','" + safeMsg + "','" + safeType + "','" + safeSound + "');", null
                              );
                          }
                      }, 300);
                  }
              }

              public class WebAppBridge {
                  Context ctx;
                  WebAppBridge(Context c) { this.ctx = c; }

                  @JavascriptInterface
                  public void setUser(String user) {
                      SharedPreferences prefs = ctx.getSharedPreferences("love8_native", MODE_PRIVATE);
                      prefs.edit().putString("current_user", user).apply();
                  }

                  @JavascriptInterface
                  public void syncLastSeenEvent(long evId) {
                      SharedPreferences prefs = ctx.getSharedPreferences("love8_native", MODE_PRIVATE);
                      prefs.edit().putLong("last_event_id", evId).apply();
                  }

                  @JavascriptInterface
                  public void flashTorchStrobe(int pulses) {
                      Love8Service.triggerSosFlashStrobe(ctx, pulses > 0 ? pulses : 10);
                  }

                  @JavascriptInterface
                  public void turnOffScreenAndSleep() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  WindowManager.LayoutParams params = getWindow().getAttributes();
                                  params.screenBrightness = 0.01f;
                                  getWindow().setAttributes(params);

                                  getWindow().clearFlags(
                                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                                      WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |
                                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                                      WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD
                                  );
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                                      setTurnScreenOn(false);
                                      setShowWhenLocked(false);
                                  }
                                  moveTaskToBack(true);
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                                      finishAndRemoveTask();
                                  } else {
                                      finish();
                                  }
                              } catch (Exception ignored) {}
                          }
                      });
                  }

                  @JavascriptInterface
                  public void checkAllPermissions() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              requestAllNeededPermissions();
                              Toast.makeText(ctx, "Autorisations vérifiées ✅", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void downloadApkUpdate(String url) {
                      try {
                          DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                          req.setTitle("Mise à jour Love8.apk");
                          req.setDescription("Téléchargement de la nouvelle version...");
                          req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "Love8-update.apk");
                          req.setMimeType("application/vnd.android.package-archive");

                          DownloadManager dm = (DownloadManager) ctx.getSystemService(Context.DOWNLOAD_SERVICE);
                          if (dm != null) {
                              dm.enqueue(req);
                          }

                          Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(browserIntent);
                      } catch (Exception e) {
                          try {
                              Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              ctx.startActivity(browserIntent);
                          } catch (Exception ignored) {}
                      }
                  }

                  @JavascriptInterface
                  public void vibrateDevice(String csvPattern) {
                      try {
                          String[] parts = csvPattern.split(",");
                          long[] timings = new long[parts.length + 1];
                          timings[0] = 0;
                          for (int i = 0; i < parts.length; i++) {
                              timings[i + 1] = Long.parseLong(parts[i].trim());
                          }
                          Vibrator v = (Vibrator) ctx.getSystemService(Context.VIBRATOR_SERVICE);
                          if (v != null) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  v.vibrate(VibrationEffect.createWaveform(timings, -1));
                              } else {
                                  v.vibrate(350);
                              }
                          }
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public boolean isDeviceLocked() {
                      KeyguardManager km = (KeyguardManager) ctx.getSystemService(Context.KEYGUARD_SERVICE);
                      return km != null && km.isKeyguardLocked();
                  }
              }
          }
          EOF

      - name: 🔨 Compilation de l'APK allégé via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Love8.apk

      - name: 📤 Publication de l'APK dans Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Love8-Jordan-Lydie-APK
          path: android/app/build/outputs/apk/debug/Love8.apk

      - name: 🚀 Publication sur GitHub Releases (APK + Clé de signature fixe persistante)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest android/app/build/outputs/apk/debug/Love8.apk ~/.android/debug.keystore --title "Dernière version Love8 APK" --notes "APK optimisé et signé avec clé persistante" || gh release upload latest android/app/build/outputs/apk/debug/Love8.apk ~/.android/debug.keystore --clobber
