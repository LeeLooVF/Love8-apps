name: Build Love8 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Préparation du dossier Web & Capacitor 6
        run: |
          mkdir -p www
          cp index.html www/index.html

          sed -i "s|const API_ENDPOINT = '/state';|const API_ENDPOINT = 'https://love8-apps.pages.dev/state';|g" www/index.html

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.love8.app",
            "appName": "Love8",
            "webDir": "www",
            "server": {
              "url": "https://love8-apps.pages.dev",
              "cleartext": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: 🔒 Injection Service Arrière-Plan, GPS, Vibreur Natif & Réveil Écran Verrouillé
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");

            const perms = `
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />
            `;

            xml = xml.replace("<application", perms + "\n    <application");
            xml = xml.replace(
              "android:name=\".MainActivity\"",
              "android:name=\".MainActivity\" android:showWhenLocked=\"true\" android:turnScreenOn=\"true\""
            );

            const serviceTag = `
              <service
                android:name=".Love8Service"
                android:enabled="true"
                android:exported="false"
                android:foregroundServiceType="specialUse" />
            </application>`;

            xml = xml.replace("</application>", serviceTag);
            fs.writeFileSync(manifestPath, xml, "utf8");
          '

          cat << 'EOF' > android/app/src/main/java/com/love8/app/Love8Service.java
          package com.love8.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class Love8Service extends Service {
              private static final String CHANNEL_BG = "love8_bg_service";
              private static final String CHANNEL_ALERTS = "love8_alerts_v2";
              private Handler handler = new Handler(Looper.getMainLooper());
              private Runnable poller;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannels();
                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(this, CHANNEL_BG)
                      : new Notification.Builder(this);

                  Notification bgNotif = builder
                      .setContentTitle("Love8 connecté ❤️")
                      .setContentText("Veille active Jordan & Lydie")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setOngoing(true)
                      .build();

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1001, bgNotif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(1001, bgNotif);
                  }
                  startPolling();
              }

              private void createChannels() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      NotificationChannel bg = new NotificationChannel(CHANNEL_BG, "Veille Permanente Love8", NotificationManager.IMPORTANCE_LOW);
                      nm.createNotificationChannel(bg);

                      NotificationChannel alerts = new NotificationChannel(CHANNEL_ALERTS, "Vibrations & Alertes Love8", NotificationManager.IMPORTANCE_HIGH);
                      alerts.enableVibration(true);
                      alerts.setVibrationPattern(new long[]{0, 250, 100, 350});
                      alerts.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(alerts);
                  }
              }

              private void startPolling() {
                  poller = new Runnable() {
                      @Override
                      public void run() {
                          new Thread(new Runnable() {
                              @Override
                              public void run() {
                                  checkCloudState();
                              }
                          }).start();
                          handler.postDelayed(this, 4000);
                      }
                  };
                  handler.post(poller);
              }

              private void checkCloudState() {
                  try {
                      URL url = new URL("https://love8-apps.pages.dev/state");
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setConnectTimeout(3500);
                      conn.setReadTimeout(3500);
                      BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = reader.readLine()) != null) sb.append(line);
                      reader.close();

                      JSONObject json = new JSONObject(sb.toString());
                      if (!json.has("lastEvent")) return;
                      JSONObject ev = json.getJSONObject("lastEvent");
                      long evId = ev.optLong("id", 0);
                      String sender = ev.optString("sender", "");
                      String title = ev.optString("title", "Love8 ❤️");
                      String message = ev.optString("message", "Nouvelle vibration !");
                      String emoji = ev.optString("emoji", "❤️");

                      SharedPreferences prefs = getSharedPreferences("love8_native", MODE_PRIVATE);
                      long lastSeen = prefs.getLong("last_event_id", 0);
                      String myUser = prefs.getString("current_user", "Jordan");

                      if (evId > lastSeen) {
                          prefs.edit().putLong("last_event_id", evId).apply();
                          if (!sender.equalsIgnoreCase(myUser) || title.contains("Douglasse")) {
                              triggerWakeAndNotification(title, message, emoji);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              public void triggerWakeAndNotification(String title, String message, String emoji) {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          PowerManager.WakeLock wl = pm.newWakeLock(
                              PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP | PowerManager.ON_AFTER_RELEASE,
                              "love8:wakelock"
                          );
                          wl.acquire(6000);
                      }

                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createWaveform(new long[]{0, 250, 100, 400}, -1));
                          } else {
                              v.vibrate(600);
                          }
                      }

                      Intent fullIntent = new Intent(this, MainActivity.class);
                      fullIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      fullIntent.putExtra("lock_alert", true);
                      fullIntent.putExtra("emoji", emoji);

                      PendingIntent fullPending = PendingIntent.getActivity(
                          this, (int) System.currentTimeMillis(), fullIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, CHANNEL_ALERTS)
                          : new Notification.Builder(this).setSound(soundUri);

                      nb.setSmallIcon(android.R.drawable.ic_dialog_email)
                        .setContentTitle(title)
                        .setContentText(message)
                        .setAutoCancel(true)
                        .setContentIntent(fullPending)
                        .setFullScreenIntent(fullPending, true);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          nb.setVisibility(Notification.VISIBILITY_PUBLIC)
                            .setCategory(Notification.CATEGORY_CALL);
                      }

                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.notify((int) (System.currentTimeMillis() % 10000), nb.build());

                      startActivity(fullIntent);
                  } catch (Exception ignored) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/love8/app/MainActivity.java
          package com.love8.app;

          import android.Manifest;
          import android.app.KeyguardManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }
                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                      WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[]{
                          Manifest.permission.POST_NOTIFICATIONS,
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION
                      }, 101);
                  }

                  Intent svc = new Intent(this, Love8Service.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(svc);
                  } else {
                      startService(svc);
                  }

                  this.bridge.getWebView().addJavascriptInterface(new WebAppBridge(this), "AndroidNative");
                  handleWakeIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleWakeIntent(intent);
              }

              private void handleWakeIntent(Intent intent) {
                  if (intent != null && intent.getBooleanExtra("lock_alert", false)) {
                      String emoji = intent.getStringExtra("emoji");
                      if (emoji == null) emoji = "❤️";
                      final String safeEmoji = emoji.replace("'", "");
                      this.bridge.getWebView().postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              MainActivity.this.bridge.getWebView().evaluateJavascript(
                                  "if(window.onNativeWakeAlert) window.onNativeWakeAlert('" + safeEmoji + "');", null
                              );
                          }
                      }, 600);
                  }
              }

              public class WebAppBridge {
                  Context ctx;
                  WebAppBridge(Context c) { this.ctx = c; }

                  @JavascriptInterface
                  public void setUser(String user) {
                      SharedPreferences prefs = ctx.getSharedPreferences("love8_native", MODE_PRIVATE);
                      prefs.edit().putString("current_user", user).apply();
                  }

                  @JavascriptInterface
                  public void vibrateDevice(String csvPattern) {
                      try {
                          String[] parts = csvPattern.split(",");
                          long[] timings = new long[parts.length + 1];
                          timings[0] = 0;
                          for (int i = 0; i < parts.length; i++) {
                              timings[i + 1] = Long.parseLong(parts[i].trim());
                          }
                          Vibrator v = (Vibrator) ctx.getSystemService(Context.VIBRATOR_SERVICE);
                          if (v != null) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  v.vibrate(VibrationEffect.createWaveform(timings, -1));
                              } else {
                                  v.vibrate(350);
                              }
                          }
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void showSystemNotification(String title, String message) {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      Notification.Builder b;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel("love8_alerts_v2", "Vibrations & Alertes Love8", NotificationManager.IMPORTANCE_HIGH);
                          ch.enableVibration(true);
                          nm.createNotificationChannel(ch);
                          b = new Notification.Builder(ctx, "love8_alerts_v2");
                      } else {
                          b = new Notification.Builder(ctx);
                      }
                      b.setSmallIcon(android.R.drawable.ic_dialog_email)
                       .setContentTitle(title)
                       .setContentText(message)
                       .setAutoCancel(true);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          b.setVisibility(Notification.VISIBILITY_PUBLIC);
                      }
                      nm.notify((int) (System.currentTimeMillis() % 10000), b.build());
                  }

                  @JavascriptInterface
                  public boolean isDeviceLocked() {
                      KeyguardManager km = (KeyguardManager) ctx.getSystemService(Context.KEYGUARD_SERVICE);
                      return km != null && km.isKeyguardLocked();
                  }
              }
          }
          EOF

      - name: 🔨 Compilation de l'APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Love8-Jordan-Lydie-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
