name: Build Love8 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Préparation du dossier Web & Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html

          # Adapte automatiquement l'URL API pour que l'APK pointe vers ton Cloudflare Pages
          sed -i "s|const API_ENDPOINT = '/state';|const API_ENDPOINT = 'https://love8-apps.pages.dev/state';|g" www/index.html

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.love8.app",
            "appName": "Love8",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://love8-apps.pages.dev",
              "cleartext": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: 🔒 Activation Écran de Verrouillage, Vibrations & Notifications (Android Natif)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # 1. Injection des permissions Android (Vibreur, Notifications, Réveil écran, Plein écran verrouillé)
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.VIBRATE" />\n\
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n\
          <uses-permission android:name="android.permission.WAKE_LOCK" />\n\
          <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n\
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"

          # 2. Autoriser l'activité principale à s'afficher sur l'écran de verrouillage et allumer l'écran
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:showWhenLocked="true" android:turnScreenOn="true" android:launchMode="singleTop"/' "$MANIFEST"

          # 3. Ajout des flags WindowManager dans MainActivity.java pour forcer le réveil sur Android 8 à 15
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java")
          cat << 'EOF' > "$MAIN_ACT"
          package com.love8.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }
                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                      WindowManager.LayoutParams.FLAG_ALLOW_LOCK_WHILE_SCREEN_ON |
                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                      WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                  );
              }
          }
          EOF

      - name: 🔨 Compilation de l'APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Publication de l'APK prêt à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: Love8-Jordan-Lydie-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
