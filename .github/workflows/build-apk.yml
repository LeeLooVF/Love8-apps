name: Build Love8 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Préparation du dossier Web & Capacitor 6
        run: |
          mkdir -p www
          cp index.html www/index.html

          # Pointe vers ton URL Cloudflare Pages
          sed -i "s|const API_ENDPOINT = '/state';|const API_ENDPOINT = 'https://love8-apps.pages.dev/state';|g" www/index.html

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.love8.app",
            "appName": "Love8",
            "webDir": "www",
            "server": {
              "url": "https://love8-apps.pages.dev",
              "cleartext": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: 🔒 Injection propre Écran de Verrouillage & Permissions
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");

            const perms = `
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
            `;

            xml = xml.replace("<application", perms + "\n    <application");
            xml = xml.replace(
              "android:name=\".MainActivity\"",
              "android:name=\".MainActivity\" android:showWhenLocked=\"true\" android:turnScreenOn=\"true\""
            );

            fs.writeFileSync(manifestPath, xml, "utf8");
          '

          cat << 'EOF' > android/app/src/main/java/com/love8/app/MainActivity.java
          package com.love8.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }
                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                      WindowManager.LayoutParams.FLAG_ALLOW_LOCK_WHILE_SCREEN_ON |
                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                      WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                  );
              }
          }
          EOF

      - name: 🔨 Compilation de l'APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Love8-Jordan-Lydie-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
